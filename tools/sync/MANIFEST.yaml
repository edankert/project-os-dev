# project-os sync manifest — consumed by tools/scripts/sync-project-os.py.
# Declares per-path ownership for template syncs. More specific paths override less specific ones.
#
# ownership values:
#   template  - template-owned: overwritten when the downstream copy matches the recorded baseline;
#               locally diverged copies are skipped and reported for hand-merge (--force overrides)
#   merge     - template-owned base where downstream divergence is EXPECTED (real project content
#               lives here in some repos); never auto-overwritten when diverged, reported as info
#   seed      - copied once when missing downstream; never overwritten after that
#   project   - never touched by sync; listed so the boundary is explicit and auditable
#   generated - not synced; regenerated post-sync by tools/scripts/generate-adapters.py
version: 1
paths:
  "tools/instructions/": template
  "tools/skills/": template
  "tools/agents/": template
  "tools/adapters/": template
  "tools/scripts/": template
  "tools/sync/": template
  "tools/cockpit/": template
  "docs/__templates__/": template
  "docs/__templates__/SCHEMAS.md": merge
  "docs/__bases__/": template
  "docs/phases/": merge
  "docs/PHASES.md": merge
  # Seed: copied once, then the project's. Each is filled with project facts
  # (a brief, security notes, a record's own sections), and as template files
  # they were reported as conflicts on every sync (FEAT-0037, 2026-09-18).
  "docs/README.md": seed
  "docs/INDEX.md": seed
  "CONTEXT.md": template
  "AGENTS.md": template
  "LLM_BRIEF.md": seed
  "SECURITY.md": seed
  "ROADMAP.md": merge
  "docs/reference/README.md": seed
  # Where a repo's first acceptance verdict goes (project-os-dev ISS-0059). A repo
  # that wrote its own, such as project-os-deck, keeps it.
  "docs/releases/ledgers/README.md": seed
  # Any other workflow is the project's own: a repo adds its own CI (deck-smoke.yml)
  # without editing this template-owned file (FEAT-0037).
  ".github/workflows/": project
  # template-owned, not seed: this workflow carries enforcement the template owns,
  # so a CI change made here must reach every repo. As `seed` it was copied once and
  # never overwritten, meaning validator/CI changes stopped at the template (TASK-0072).
  ".github/workflows/validate-docs.yml": template
  ".github/workflows/link-check.yml": seed
  # Seed: a repo may add its own lines. It keeps the archive out of ripgrep and
  # agent search (project-os-dev ISS-0091).
  ".ignore": seed
  "docs/archive/": project
  ".prettierrc": seed
  ".markdownlint.jsonc": seed
  ".yamllint.yml": seed
  # The JDK a Gradle repo targets, read by the validate-docs workflow. Per-repo.
  ".java-version": project
  "SNAPSHOT.yaml": project
  "CLAUDE.md": project
  "docs/features/": project
  "docs/issues/": project
  "docs/requirements/": project
  "docs/tests/": project
  "docs/changes/": project
  "docs/decisions/": project
  "docs/workflows/": project
  "docs/reference/": project
  "docs/research/": project
  ".agents/skills/": generated
  ".codex/agents/": generated
  ".codex/hooks.json": generated
  ".claude/skills/": generated
  ".claude/agents/": generated
  ".cursor/rules/": generated
excludes:
  "tools/cockpit/": [".venv", "*.egg-info", "__pycache__", ".pytest_cache"]
# Paths the template renamed: old -> new. A sync deletes the old path from a
# consumer, edited or not, and says what replaced it. project-os-dev ADR-0050
# renamed the walk to the release test, with no period in which both names work.
renamed:
  "tools/scripts/walk-sheet.py": "tools/scripts/release-test.py"
  "tools/scripts/walk-tags.py": "tools/scripts/release-test-tags.py"
  "tools/scripts/test-walk-sheet.sh": "tools/scripts/test-release-test.sh"
  "tools/scripts/test-walk-preparation.py": "tools/scripts/test-release-test-preparation.py"
  "docs/__templates__/walk.md": "docs/__templates__/release-test.md"
  "tools/skills/walk-procedure/": "tools/skills/release-test-procedure/"
  ".claude/skills/walk-procedure/": ".claude/skills/release-test-procedure/"
  ".agents/skills/walk-procedure/": ".agents/skills/release-test-procedure/"
# Scripts that move a consumer's own files after a rename. The sync runs each
# with --check and, when it has work to do, prints the command that does it.
migrations:
  - "tools/scripts/migrate-release-test-names.py"
