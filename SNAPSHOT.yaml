      phase: "[[PHASE-999]]"
      component: tooling
      note: "Clean-context CODE review verdict on FEAT-0022 (changes-requested); ISS-0032 was the planning-note review. Five blocking. Worst: condition (5) checks that a note is INDEXED, not that it parses, so TASK-0182/0183/0187 in project-os-cockpit were pruned against zero-byte notes and tasks_done fell 271->268 — the same 3 zero-byte notes ISS-0032 #5 found, fail-safed on the derivation path and not the destructive one. Second: _scalar_span picks block-vs-inline from find('{') over the whole line, so any block-style value containing a brace is never derived and never reported, --check included; live in yourtrainer-mcp TASK-0065. Third: the migration record says 0 replaced in project-os-dev/articles/edankert.com, which replaced 43 between them. Fourth: stubbing prune_entries and sync_derived_fields to return [] leaves TST-0003 green. Fifth: the condition-3 fixture is not illegal and the deferred branch is unreachable, so ISS-0032 #6 is unresolved. Held on re-measurement: idempotence, --check in both YAML styles, no validator check silenced, the 12/3 hold measurement, 0 errors in twelve repos, -39% fleet and -71% your-trainer."
      related: [FEAT-0022, ADR-0018, ISS-0032, TST-0003]
    ISS-0032:
      file: "docs/issues/ISS-0032-FEAT-0022-Amendment-Leftovers-And-Derivation-Failsafe.md"
      title: "Independent review of FEAT-0022/ADR-0018: ADR-0018 still publishes the pre-amendment hold table, TASK-0082 contradicts itself on whether `goal:` holds, three tasks carry Definitions of Done that require the task depending on them, and title derivation has no fail-safe for the 9 notes fleet-wide that yield no title"
      status: open
      severity: high
      phase: "[[PHASE-999]]"
      component: docs
      note: "Clean-context review verdict on FEAT-0022 (changes-requested). Five blocking, seven not. The measurement mostly reproduces exactly — 659 drift, 1,756/142/1,614, 75/659, -28%/+2% — so these are amendment leftovers rather than a bad design. Worst: ADR-0018's hold table is the pre-amendment rule (19/58 and 36/238 reproduce only if `goal:` also holds; today 8/69 and 34/240), and TASK-0082/0083/0084 each require fleet-wide completion in their DoD while TASK-0085 depends on all three, so no task can be ticked. One real design gap: derivation has no fail-safe where the prune does, blanking 9 entries whose notes are zero-byte or unparseable."
    ISS-0031:
      file: "docs/issues/ISS-0031-Instruction-Prescribes-A-Method-For-Two-Different-Needs.md"
      title: "The startup instruction prescribes one method — read the whole snapshot — for two different needs, and agents comply with it 5 times in 260; whether the 255 that grep instead are actually oriented is unmeasured"
      status: open
      severity: medium
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Orientation and lookup are different needs; grep serves the second and cannot serve the first (it never sees focus:). Deliberately does NOT claim the behaviour is more correct — only that it is cheaper. Whether grep-only leaves an agent oriented is unmeasured, and assuming otherwise is the error ISS-0030 retracted. Settled by adding a grep-only arm to bench TASK-0008. Shares a fix with ISS-0030: a pruned snapshot IS the orientation slice."
      related: [ISS-0030]
    ISS-0030:
      file: "docs/issues/ISS-0030-Retention-Is-Policy-Nothing-Performs.md"
      title: "Retention is a policy nothing performs, configured by three flags no code reads, and its normative rule still names the `closed` status ADR-0008 deleted — so snapshots accumulate until most of what a query matches is finished work"
      status: open
      severity: medium
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Upstream cause of your-trainer ISS-0371. The four largest snapshots are the four oldest repos (97k/50k/44k/38k tok) — accumulation, not complexity. CORRECTED 2026-08-03: the original 're-served on every request' cost model was never measured and is false. Nothing injects the snapshot, agents grep it 255x per 5 full reads, and all project-os artefacts are ~8% of what enters context (source code 46%, command output 44%). The surviving case is retrieval quality — a two-thirds-terminal snapshot returns mostly finished work to every grep. Does NOT relitigate TASK-0063: the whole-file generator was rejected on evidence and stays rejected; the gap is that the motivation its cancellation preserved (REQ-0020 amendment) was never built. Three options, none requiring generation."
    ISS-0029:
      file: "docs/issues/ISS-0029-Lifecycle-Says-When-A-Phase-Is-Needed-Never-When-One-Is-Too-Small.md"
      title: "LIFECYCLE says when a phase note is needed and never when one is too small, so an agent under the document-first rule mints a phase per request — measured at nine in a day against nine in the preceding twelve weeks"
      status: open
      severity: medium
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Filed from project-os-cockpit ISS-0077: nine phases in a day against nine in twelve weeks, median 4 items vs 21. Structural, not careless — document-first needs a focus item and an open phase is the cheapest way to get one. The missing mechanism is the STANDING phase; without somewhere to put a small thing, minting a phase is the only move."
    ISS-0028:
      file: "docs/issues/ISS-0028-Close-Out-Has-No-Answer-For-Cannot-Fix.md"
      title: "Close-out says to run the validator and fix what it reports, and has no answer for 'cannot fix' — which is exactly the case that needs a human and therefore the one that must leave a record"
      status: open
      severity: low
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Filed from project-os-cockpit FEAT-0051. The missing half of an existing sentence: every validator error is either fixed or FILED, deduped on (code, subject). Not an automatic filer — issues appearing unasked is a worse failure than one occasionally missed. Running downstream in CLAUDE.md, with a guard that fails if the template adopts it."
    ISS-0027:
      file: "docs/issues/ISS-0027-Terminal-Items-Are-Stranded-In-The-Parking-Lot-Phase.md"
      title: "Nothing re-homes an item's phase at close-out, so work delivered without a plan stays in the PHASE-999 parking lot forever — 16 of 19 notes naming it in one repo are terminal, and the phase strip draws 16 `delivered` squares inside a phase titled 'Future'"
      status: open
      severity: medium
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Filed from project-os-cockpit, where 16 of 19 notes naming the sentinel are terminal and the phase strip draws 16 delivered squares inside a phase called Future. The field answers a plan-time question that is never re-asked at close-out, so items are stuck by construction rather than by neglect. Fix is the mirror of PHASE-CHILDREN, reusing PHASE_RESOLVED. Fleet backlog: your-trainer 72, project-os-dev 42."
    ISS-0026:
      file: "docs/issues/ISS-0026-Coverage-Registers-Are-Hand-Maintained.md"
      title: "A TST note's ## Coverage section is a hand-written register of its own suite's assertions that nothing derives or checks, and other notes cite its entries as evidence — one register was wrong in three consecutive review rounds"
      status: open
      severity: medium
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Filed from project-os-cockpit ISS-0066. Same dual-write class ADR-0009 and ADR-0010 already solved for statuses and test results — the suite is the truth, the prose is an unchecked copy, and only the copy is read. Four review rounds on one note, wrong in three of them."
    ISS-0025:
      file: "docs/issues/ISS-0025-Review-Verdict-Vocabulary-Is-Unvalidated.md"
      title: "The validator checks that review_verdict is PRESENT but never that it is a DEFINED value, so any string reads as a satisfied review — 10 notes in one repo carried `CLOSE`, which QUALITY.md does not define"
      status: open
      severity: medium
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Filed from project-os-cockpit ISS-0069. The trap is that a union check is not enough: a plan-acceptance value must not satisfy a close-out gate, and a downstream implementation that claimed to split by context was shown by mutation to be checking a union. Three contexts, not two — design acceptance is the one that gets missed."
    ISS-0024:
      file: "docs/issues/ISS-0024-Template-Workflows-Ship-Permanently-Draft.md"
      title: "The template ships three WF notes at status: draft that nothing links and no repo has ever touched — 8 of 8 adopting repos still carry them unedited at draft since 2026-01-29, and the two repos that actually used docs/workflows/ deleted them first"
      status: open
      severity: low
      phase: "[[PHASE-999-Parking-Lot]]"
      note: "Filed from project-os-cockpit PHASE-010, which had to measure whether the [[workflow]] type is used at all before deciding where it belongs in that app's IA. Every authored workflow across the fleet is `active`; every template one is `draft`. The three are single-entrypoint wrappers around a skill or script that instructions already own, and nothing links them — SYNCING.md does not link WF-0002. Recommendation is to ship the README only; the honest alternative is to make them active and linked. Not decided here."
      related: [WF-0001, WF-0002, WF-0003]
    ISS-0023:
      file: "docs/issues/ISS-0023-Three-Question-Test-Contradicts-The-Amended-Clause-3.md"
      title: "Round two on ADR-0017: the frontmatter three-question test still asks who writes the field, which the amended clause 3 abandoned, so it fails the two mechanisms the body calls compliant; two notes still quote the superseded clause; and ISS-0021's new provenance paragraph mis-cites TASK-0070 and claims months of drift where the tree shows three days"
      status: open
      severity: medium
      phase: "[[PHASE-999]]"
      note: "Round-two independent review of ADR-0017 (verdict changes-requested, superseding round one). All five ISS-0022 findings verified resolved; the fixes introduced five new ones, three blocking. The pattern worth watching: each round's fix has reintroduced the previous round's defect class one level along — a mis-cited ID, and a claim wider than the tree."
      related: [ISS-0022, ADR-0017]
    ISS-0022:
      file: "docs/issues/ISS-0022-ADR-0017-Ratifies-A-Proposed-ADR-And-Clause-3-Has-No-Scope.md"
      title: "ADR-0017 is accepted while ratifying ADR-0014, which is only proposed; clause 3 has no stated subject, so read literally it forbids the waiver and manual-test paths the same ADR says it preserves; and a consequence names ISS-0020 for ISS-0019's defect"
      status: open
      severity: medium
      phase: "[[PHASE-999]]"
      note: "Independent-review findings on ADR-0017 (verdict changes-requested). Three blocking, two corrections; the ADR's three-decisions-one-rule thesis survived refutation. Also carries the correction that this repo has 19 waivers, not the 15 ISS-0021 and the intake note record."
    ISS-0021:
      file: "docs/issues/ISS-0021-Verification-Waivers-Have-No-Budget.md"
      title: "Verification waivers expire individually but nothing bounds how many are outstanding, and a batch stamped with one date is indistinguishable from waivers considered one at a time — all 19 in this repo expire 2026-10-23, the migration default no waiver has diverged from since"
      status: open
      severity: low
      phase: "[[PHASE-999]]"
      note: "Intake finding 8, narrowed — the expiry half was stale (waiver_expires errors since TASK-0068). Blocked behind ISS-0019 by sequencing: capping the visible exit while the silent one is open is a regression."
      depends: [ISS-0019]
    ISS-0020:
      file: "docs/issues/ISS-0020-Nothing-Requires-A-Test-To-Be-Executable.md"
      title: "Nothing requires a `TST-*` to carry a `command:`, and no metric distinguishes executable from manual tests — so the project cannot report how much of its verification actually runs"
      status: open
      severity: medium
      phase: "[[PHASE-999]]"
      note: "Intake finding 2, scoped to the derived metric only. Requiring command: is deliberately out of scope — ADR-0010 rejected fake automation and ADR-0017 clause 2 says label the unexecutable, don't outlaw it."
    ISS-0019:
      file: "docs/issues/ISS-0019-Verify-Is-Blind-To-Tests-That-Were-Never-Linked.md"
      title: "VERIFY iterates only over tests that exist, so an item reaching terminal with zero linked tests and no waiver passes silently — 52 registered items in this repo did exactly that, against QUALITY.md's stated rule"
      status: open
      severity: high
      phase: "[[PHASE-999]]"
      note: "Intake finding 7, upgraded from conceptual to mechanical on verification. Contradicts QUALITY.md's 'silent skips are a build failure'; REQ-0006's wording sanctions the bug. Needs the 52-item backfill before any cutover (ISS-0007 precedent)."
      blocks: [ISS-0021]
    ISS-0018:
      file: "docs/issues/ISS-0018-Traceability-Stops-At-The-Docs-Boundary.md"
      title: "The link graph stops at the docs boundary: no requirement names the code that implements it, so `implemented` is asserted by the agent seeking the transition and an unimplemented requirement is undetectable"
      status: open
      severity: medium
      phase: "[[PHASE-999]]"
      note: "Filed from the 2026-07-29 comparable-systems review. Prior art is OpenFastTrace/StrictDoc. Filed because the hole is structural, not because the fix is obviously correct — coverage tags tax source files and policy requirements have no implementing code."
    ISS-0017:
      file: "docs/issues/ISS-0017-Review-Verdicts-Never-Expire.md"
      title: "A review verdict never expires: `reviewed_by`/`review_date`/`review_verdict` survive any later edit to the note they approved, so an approved note and a rewritten-since-approval note are indistinguishable"
      status: open
      severity: medium
      phase: "[[PHASE-999]]"
      note: "Filed from the 2026-07-29 comparable-systems review. Doorstop's item fingerprints and suspect links. Probably the review-surface case of ADR-0014's revision rather than a separate mechanism."
    ISS-0016:
      file: "docs/issues/ISS-0016-Registry-Keyed-On-Identity-And-Unchecked-Metric-Prefixes.md"
      title: "The completeness registry was keyed on id(), which CPython constant-dedup defeats; and every total metric skipped its prefix check, so a mistyped prefix silently read zero"
      status: fixed
      severity: medium
      phase: "[[PHASE-999]]"
      note: "Found by TASK-0077's two-arm experiment. Clean-context Opus 3 findings, gpt-5-codex 1, one run each."
    ISS-0005:
      file: docs/issues/ISS-0005-Feature-Less-Requirement-Triage.md
      title: "Feature-less requirement triage (ADR-0007 follow-up): 14 of 23 resolved mechanically; 9 are a real residue — 5 policies, 3 conventions, 1 unscheduled deliverable"
      status: open
      severity: low
      phase: PHASE-999
    ISS-0015:
      file: docs/issues/ISS-0015-Walker-Depth-Cap-And-Decision-Alias-Nondeterminism.md
      title: "The walker stops at depth 4 while the docstring and TST-0002 say 'any nesting depth'; and the decision-alias hole was a hash-seed coin flip, not 'validated against nothing' — STATUS-VALUE still picks its type nondeterministically"
      status: fixed
      severity: low
      owner: user:edwin
      phase: PHASE-999
      note: "Filed from independent review of TST-0002/CHG-20260726 round four (changes-requested): every ISS-0014 fix verified on the merits — file structure clean, fleet identical, twelve branches fire, metrics parity independently confirmed — remaining findings are a two-sentence prose overclaim and a nondeterministic type pick in STATUS-VALUE"
      related: [ISS-0011, ISS-0012, ISS-0013, ISS-0014, TST-0002]
    ISS-0014:
      file: docs/issues/ISS-0014-Validator-Tail-Duplicated-And-No-Inline-Literal-Claim.md
      title: "validate-docs.py ships its own second half twice: lines 1560–2560 duplicate 556–1556 verbatim, fleet-wide; the 'no inline status literal remains' claim is false; the walker's boundary prose still overclaims on dict, underscore names and nesting"
      status: fixed
      severity: medium
      owner: user:edwin
      phase: PHASE-999
      note: "Filed from independent review of TST-0002/CHG-20260726 round three (changes-requested): ISS-0013's fixes all verified on the merits, but the fix commit doubled the validator's second half and shipped the duplicate byte-identical to all 12 fleet files"
      related: [ISS-0011, ISS-0012, ISS-0013, ADR-0012, TST-0002]
    ISS-0013:
      file: docs/issues/ISS-0013-Completeness-Assertion-Boundary-Overclaims.md
      title: "Completeness assertion sees only tuples, its prose says 'constant'; the 'covers every status collection in this file' docstring phrase survives ISS-0012's own post-mortem; a round-one finding (stale your-sudoku follow-up) left unaddressed"
      status: fixed
      severity: low
      owner: user:edwin
      phase: PHASE-999
      note: "Filed from independent re-review of TST-0002/CHG-20260726 round two (changes-requested); round-one ISS-0012 findings all verified fixed — remaining fixes are two lines of walker widening plus prose scoping and one stale checkbox"
