  decisions:
    ADR-0011:
      file: docs/decisions/ADR-0011-No-Permanent-Warning-Tier.md
      title: "Every validator rule is an error or is deleted — no permanent warning tier"
      status: accepted
      owner: user:edwin
      decision: "Every check in validate-docs.py is either an error or is removed. `warn` survives only as a dated migration state whose cutover is encoded in the code and no more than 90 days out; a check with no cutover is promoted or deleted"
      related: [ADR-0004, ADR-0007, ADR-0008, FEAT-0017]
    ADR-0010:
      file: docs/decisions/ADR-0010-Test-Status-Stamped-By-Execution.md
      title: "Test status is stamped by execution, not asserted by an author"
      status: accepted
      owner: user:edwin
      decision: "A TST-* note with a `command:` has its status written only by executing it; hand-editing is a validator error. Manual tests keep an author-written status but carry `last_verified:` and expire. `verification_waiver` gains an expiry date"
      related: [ADR-0004, ADR-0007, REQ-0006, FEAT-0016]
    ADR-0009:
