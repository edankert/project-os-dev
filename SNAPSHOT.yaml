  decisions:
    ADR-0024:
      file: "docs/decisions/ADR-0024-A-Normative-Rule-Is-Stated-Once.md"
      title: "A normative rule is stated in one file and linked everywhere else"
      status: accepted
      owner: user:edwin
      decision: "Option 1. Widen REQ-0018 from state rules to every normative rule; a terminal requirement is not reopened, so REQ-0027 supersedes it. Discharge is the docs-audit drift dimension; a mechanical RULE-ONCE check stays an open acceptance thread"
      related: [ISS-0006, ISS-0041, ISS-0042, ISS-0043, REQ-0018, REQ-0027, ADR-0023]
      note: "Accepted 2026-09-03 with option 1. REQ-0027 supersedes REQ-0018 and widens it to every normative rule; RULE-ONCE stays an open acceptance thread."
    ADR-0023:
      file: docs/decisions/ADR-0023-A-Quantified-Rule-Is-A-Decision.md
      title: "A quantified rule is a decision: a rule of the form \"every member of DOMAIN satisfies P\" is recorded as an ADR carrying `## Rule`, `## Domain` and `## Conformance`"
      status: accepted
      owner: user:edwin
      decision: "Option 4. Three sections inside the existing decision kind: `## Rule` (one testable normative sentence), `## Domain` (the enumerable set it ranges over — if the set cannot be named the rule is not ready), `## Conformance` (the named discharge plus which side is authoritative on conflict). The presence of `## Rule` is the marker; no new kind, per ADR-0022"
      related: [ADR-0022, ADR-0007, ADR-0011, ADR-0021, ISS-0005, REQ-0025]
    ADR-0022:
      file: docs/decisions/ADR-0022-Conventions-Before-Types.md
      title: "Conventions before types: a new note kind is minted only when an existing kind demonstrably cannot carry the semantics, and a convention that stands in for one must name its discharge"
      status: accepted
      owner: user:edwin
      decision: "Option 2. A new first-class kind is created only on at least two concrete instances of a convention failing structurally rather than aesthetically; until then new semantics ride inside an existing kind as a marked convention — a section convention, a role field, or a manifest — and a convention standing in for a type must name the check that discharges it"
      related: [ADR-0008, ADR-0023, ISS-0005, FEAT-0019]
    ADR-0018:
      file: docs/decisions/ADR-0018-What-The-Generator-Owns.md
      title: "What the generator owns: it derives every field that has a note counterpart, it may remove entries by a reproducible rule but never add one, and item-level `note:` is scratch context that holds its entry until cleared"
      status: accepted
      owner: user:edwin
      decision: "Three rules: fields with a note counterpart are derived (title, feature goal, joining status/counters/metrics); membership is derivable in ONE direction (remove, never add); item-level note: is scratch context that HOLDS its entry from removal and is reported, released by clearing it once the durable copy is in the note file"
      related: [ADR-0009, ADR-0005, ADR-0017, ISS-0030, ISS-0031]
    ADR-0017:
      file: docs/decisions/ADR-0017-Claims-About-Working-Software-Are-Derived.md
      title: "A claim about whether the software works is derived from execution where execution is possible, labelled and dated where it is not, and in neither case trusted on the unmarked word of the party seeking the transition it gates"
      status: accepted
      owner: user:edwin
      decision: "State as one rule what ADR-0009, ADR-0010 and ADR-0014 each implement for one field. Three clauses; clause 3 is the invariant. Bounded to the running-system layer, with gate manifests, observability, pre-commitment reversibility and code contracts recorded as deliberate non-goals"
      related: [ADR-0009, ADR-0010, ADR-0014, ADR-0016, ISS-0017]
    ADR-0016:
      file: docs/decisions/ADR-0016-Ceremony-Proportionate-To-The-Change.md
      title: "Ceremony is proportionate to the change: a declared fast path, or the rule that every change is documented stops being followed"
      status: proposed
      owner: user:edwin
      decision: "Two paths through the lifecycle, selected by blast radius rather than effort. Small changes get an ISS-*, the fix and the validator; contract/path/fleet/requirement changes keep the full path. The selector is written down once and linked, never restated"
      related: [ADR-0004, ADR-0008, ADR-0011, ADR-0014]
    ADR-0015:
      file: docs/decisions/ADR-0015-Intent-Layer-Not-A-Git-Host.md
      title: "If project-os is ever hosted, it is an intent layer over git — never a git host, never an agent runtime"
      status: proposed
      owner: user:edwin
      decision: "Park the hosted product. If ever built: git stays the object store and is written as an output; the git host and runner are pluggable adapters; agents run on the user's machine with the user's keys"
      related: [ADR-0014, ADR-0009]
    ADR-0014:
      file: docs/decisions/ADR-0014-Evidence-Is-Typed-And-Checkable.md
      title: "Evidence is typed and checkable, and the requirement is not confined to requirements"
      status: proposed
      owner: user:edwin
      decision: "A ticked box on any note type is a claim carrying a typed evidence token and a revision; the vocabulary is closed (test/mutation/runtime/human/asserted) and REQ-BOXES generalises to every type. Measured: requirements carry evidence on 60.3% of ticked boxes, everything else on 3.7%"
      related: [ADR-0006, ADR-0010, ADR-0008, REQ-0006]
    ADR-0011:
      file: docs/decisions/ADR-0011-No-Permanent-Warning-Tier.md
      title: "Every validator rule is an error or is deleted — no permanent warning tier"
      status: accepted
      owner: user:edwin
      decision: "Every check in validate-docs.py is either an error or is removed. `warn` survives only as a dated migration state whose cutover is encoded in the code and no more than 90 days out; a check with no cutover is promoted or deleted"
      related: [ADR-0004, ADR-0007, ADR-0008, FEAT-0017]
    ADR-0010:
      file: docs/decisions/ADR-0010-Test-Status-Stamped-By-Execution.md
      title: "Test status is stamped by execution, not asserted by an author"
      status: accepted
      owner: user:edwin
      decision: "A TST-* note with a `command:` has its status written only by executing it; hand-editing is a validator error. Manual tests keep an author-written status but carry `last_verified:` and expire. `verification_waiver` gains an expiry date"
      related: [ADR-0004, ADR-0007, REQ-0006, FEAT-0016]
    ADR-0009:
      file: docs/decisions/ADR-0009-Snapshot-Is-Generated.md
      title: "SNAPSHOT.yaml is generated from the notes, not authored alongside them"
      status: accepted
      owner: user:edwin
      decision: "Note frontmatter becomes the single authored source of item state; `items.*`, `counters` and `metrics` are generated at pre-commit and verified in CI. ITEM-STATUS, COUNTER and METRICS are deleted because the failure they detect becomes structurally impossible"
      related: [ADR-0003, ADR-0005, ADR-0004, FEAT-0015]
    ADR-0008:
      file: docs/decisions/ADR-0008-States-Must-Earn-Their-Keep.md
      title: "States must earn their keep: collapse the status taxonomy to observed usage, one terminal status per work-item type"
      status: accepted
      owner: user:edwin
      decision: "Delete every status value with no observed use; give each work-item type exactly one terminal status (merging issue `closed` into `fixed`); model blocked-ness as `depends:` rather than a state; treat reopening as a transition to `open`. Whether `approved` survives is deliberately left to TASK-0053"
      related: [ADR-0007, ADR-0006, ADR-0005, FEAT-0013]
    ADR-0007:
      file: docs/decisions/ADR-0007-Requirement-Terminality-And-Ownership.md
      title: "Requirement terminality is `implemented` (retire `verified`); a requirement implements at most one feature; features gate on their requirements' criteria"
      status: accepted
      owner: user:edwin
      decision: "Retire requirement `verified` (implemented becomes terminal, criteria-gated); `implements:` names at most one feature (delete the many-to-many case); add the missing reverse gate so a feature cannot be done until every requirement naming it has resolved criteria, forward-only. Feature-less requirement triage (constraints vs unlinked deliverables) deferred to a follow-up"
      related: [ADR-0006, ADR-0005, ADR-0004]
    ADR-0001:
      file: docs/decisions/ADR-0001-Tool-Adapter-Architecture.md
      title: "Use tool-specific adapters instead of a monolithic CONTEXT.md"
      status: accepted
      owner: user:edwin
      decision: "Deliver project-os rules via tool-specific adapters rather than a single CONTEXT.md"
      related: [FEAT-0001, REQ-0001, REQ-0002]
    ADR-0002:
      file: docs/decisions/ADR-0002-Hook-Contract-Pattern.md
      title: "Define hook contracts as tool-agnostic specs with tool-specific implementations"
      status: accepted
      owner: user:edwin
      decision: "Separate hook contract definitions (what to enforce) from implementations (how to enforce) using an adapter pattern"
      related: [FEAT-0002, REQ-0003, REQ-0004]
    ADR-0003:
      file: docs/decisions/ADR-0003-Delegate-Orchestration.md
      title: "Delegate agent coordination to native tool orchestration"
      status: accepted
      owner: user:edwin
      decision: "Remove session/claimed_by orchestration from SNAPSHOT.yaml and let native tools (Agent Teams, Codex parallel) handle multi-agent coordination"
      related: [FEAT-0003, FEAT-0004, REQ-0005]
    ADR-0004:
      file: docs/decisions/ADR-0004-Mandatory-Skill-Steps.md
      title: "Shift from optional to mandatory skill steps"
      status: accepted
      owner: user:edwin
      decision: "Make risk scans, verification gating, and impact analysis mandatory steps with explicit trigger checklists"
      related: [FEAT-0005, REQ-0006, REQ-0007, REQ-0008]
    ADR-0005:
      file: docs/decisions/ADR-0005-Deferral-As-Descoping.md
      title: "Deferral is a descoping operation, not a status flip"
      status: accepted
      owner: user:edwin
      decision: "A parent's tasks list is its current scope; done/cancelled resolve scope, deferred may not remain in it — deferring an item detaches it from the parent (origin keeps provenance) and re-homes it to a future phase or the PHASE-999 parking lot"
      related: [FEAT-0011, REQ-0013, ISS-0002, ADR-0004]
    ADR-0006:
      file: docs/decisions/ADR-0006-Requirement-Advancement-On-Evidence.md
      title: "Requirements advance on evidence at feature close-out; acceptance criteria are reconciled, never ticked to fit"
      status: accepted
      owner: user:edwin
      decision: "Feature close-out must advance each linked requirement to implemented once all its implementing features are done, ticking acceptance boxes only with evidence and reconciling (amend/narrow/supersede) any criterion the delivered work deliberately departed from; frontmatter acceptance: is the criteria of record and body checkboxes are the per-criterion verification record"
      related: [FEAT-0012, REQ-0014, ISS-0004, ADR-0004]

