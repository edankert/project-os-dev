      title: "SNAPSHOT.yaml is generated from the notes, not authored alongside them"
      status: accepted
      owner: user:edwin
      decision: "Note frontmatter becomes the single authored source of item state; `items.*`, `counters` and `metrics` are generated at pre-commit and verified in CI. ITEM-STATUS, COUNTER and METRICS are deleted because the failure they detect becomes structurally impossible"
      related: [ADR-0003, ADR-0005, ADR-0004, FEAT-0015]
    ADR-0008:
      file: docs/decisions/ADR-0008-States-Must-Earn-Their-Keep.md
      title: "States must earn their keep: collapse the status taxonomy to observed usage, one terminal status per work-item type"
      status: accepted
      owner: user:edwin
      decision: "Delete every status value with no observed use; give each work-item type exactly one terminal status (merging issue `closed` into `fixed`); model blocked-ness as `depends:` rather than a state; treat reopening as a transition to `open`. Whether `approved` survives is deliberately left to TASK-0053"
      related: [ADR-0007, ADR-0006, ADR-0005, FEAT-0013]
    ADR-0007:
      file: docs/decisions/ADR-0007-Requirement-Terminality-And-Ownership.md
      title: "Requirement terminality is `implemented` (retire `verified`); a requirement implements at most one feature; features gate on their requirements' criteria"
      status: accepted
      owner: user:edwin
      decision: "Retire requirement `verified` (implemented becomes terminal, criteria-gated); `implements:` names at most one feature (delete the many-to-many case); add the missing reverse gate so a feature cannot be done until every requirement naming it has resolved criteria, forward-only. Feature-less requirement triage (constraints vs unlinked deliverables) deferred to a follow-up"
      related: [ADR-0006, ADR-0005, ADR-0004]
    ADR-0001:
      file: docs/decisions/ADR-0001-Tool-Adapter-Architecture.md
      title: "Use tool-specific adapters instead of a monolithic CONTEXT.md"
      status: accepted
      owner: user:edwin
      decision: "Deliver project-os rules via tool-specific adapters rather than a single CONTEXT.md"
      related: [FEAT-0001, REQ-0001, REQ-0002]
    ADR-0002:
      file: docs/decisions/ADR-0002-Hook-Contract-Pattern.md
      title: "Define hook contracts as tool-agnostic specs with tool-specific implementations"
      status: accepted
      owner: user:edwin
      decision: "Separate hook contract definitions (what to enforce) from implementations (how to enforce) using an adapter pattern"
      related: [FEAT-0002, REQ-0003, REQ-0004]
    ADR-0003:
      file: docs/decisions/ADR-0003-Delegate-Orchestration.md
      title: "Delegate agent coordination to native tool orchestration"
      status: accepted
      owner: user:edwin
      decision: "Remove session/claimed_by orchestration from SNAPSHOT.yaml and let native tools (Agent Teams, Codex parallel) handle multi-agent coordination"
      related: [FEAT-0003, FEAT-0004, REQ-0005]
    ADR-0004:
      file: docs/decisions/ADR-0004-Mandatory-Skill-Steps.md
      title: "Shift from optional to mandatory skill steps"
      status: accepted
      owner: user:edwin
      decision: "Make risk scans, verification gating, and impact analysis mandatory steps with explicit trigger checklists"
      related: [FEAT-0005, REQ-0006, REQ-0007, REQ-0008]
    ADR-0005:
      file: docs/decisions/ADR-0005-Deferral-As-Descoping.md
      title: "Deferral is a descoping operation, not a status flip"
      status: accepted
      owner: user:edwin
      decision: "A parent's tasks list is its current scope; done/cancelled resolve scope, deferred may not remain in it — deferring an item detaches it from the parent (origin keeps provenance) and re-homes it to a future phase or the PHASE-999 parking lot"
      related: [FEAT-0011, REQ-0013, ISS-0002, ADR-0004]
    ADR-0006:
      file: docs/decisions/ADR-0006-Requirement-Advancement-On-Evidence.md
      title: "Requirements advance on evidence at feature close-out; acceptance criteria are reconciled, never ticked to fit"
      status: accepted
      owner: user:edwin
      decision: "Feature close-out must advance each linked requirement to implemented once all its implementing features are done, ticking acceptance boxes only with evidence and reconciling (amend/narrow/supersede) any criterion the delivered work deliberately departed from; frontmatter acceptance: is the criteria of record and body checkboxes are the per-criterion verification record"
      related: [FEAT-0012, REQ-0014, ISS-0004, ADR-0004]

